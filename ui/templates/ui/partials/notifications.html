{# ui/partials/notifications.html #}
<div class="position-relative notification-wrapper">
  <button id="notificationToggle" class="icon-btn" type="button" data-panel-toggle="notificationDropdown"
          aria-label="Notifications" aria-expanded="false">
    <i class="bi bi-bell"></i>
    <span id="notificationBadge" class="notification-badge{% if not unread_notification_count %} d-none{% endif %}">{{ unread_notification_count }}</span>
  </button>

  <div id="notificationDropdown" class="notification-dropdown dropdown-panel p-0 d-none">
    {% include "ui/partials/notifications_panel.html" %}
  </div>
</div>

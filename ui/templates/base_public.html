{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>{% block title %}Ocean Clouds{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'ui/css/app.css' %}?v={{ APP_VERSION }}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body class="standard-page public-page">
  <nav class="navbar">
    <div class="container">
      <span class="navbar-brand">
        <span class="sidebar-brand-mark" style="background:#0a0a0a;color:#fff;width:32px;height:32px;border-radius:9px;" aria-hidden="true"><i class="bi bi-cloud-fill"></i></span>
        Ocean Clouds
      </span>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>

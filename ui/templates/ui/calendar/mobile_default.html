<script>
// Phones get the agenda by default; the month grid is too narrow to read there.
(function () {
  const params = new URLSearchParams(window.location.search);
  if (!params.has("view") && window.matchMedia("(max-width: 767.98px)").matches) {
    params.set("view", "agenda");
    window.location.replace(window.location.pathname + "?" + params.toString());
  }
})();
</script>

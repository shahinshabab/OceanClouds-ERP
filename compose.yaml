name: oceanclouds-erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-oceanclouds}
      POSTGRES_USER: ${DB_USER:-oceanclouds}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-oceanclouds}
      DB_USER: ${DB_USER:-oceanclouds}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  session-cleanup:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-oceanclouds}
      DB_USER: ${DB_USER:-oceanclouds}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - while true; do python manage.py close_expired_login_sessions --verbosity 0; sleep 60; done

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  static_data:
  media_data:

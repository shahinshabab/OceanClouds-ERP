{# One compact entry (month grid / all-day row). #}
{% if item.url %}<a href="{{ item.url }}"{% else %}<div{% endif %}
  class="cal-item is-{{ item.tone }}{% if item.mine %} is-mine{% endif %}"
  title="{{ item.title }}{% if item.start %} · {{ item.start|time:'g:i A' }}{% if item.end %}–{{ item.end|time:'g:i A' }}{% endif %}{% endif %}{% for icon, text in item.meta %} · {{ text }}{% endfor %}{% if item.status %} · {{ item.status }}{% endif %}">
  {% if item.icon %}<i class="bi {{ item.icon }}" aria-hidden="true"></i>{% endif %}
  {% if item.start %}<span class="cal-time">{{ item.start|time:"g:i" }}{{ item.start|time:"a"|first }}</span>{% endif %}
  <span class="cal-title">{{ item.title }}</span>
{% if item.url %}</a>{% else %}</div>{% endif %}
